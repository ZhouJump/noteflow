<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOMR 浏览器端乐谱识别（M4）</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Noto Sans SC", sans-serif;
        --line: rgba(128, 128, 128, 0.35);
        --panel: rgba(128, 128, 128, 0.08);
        --accent: #1a73e8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1rem 1.25rem 2rem;
        display: grid;
        gap: 0.9rem;
        grid-template-columns: minmax(0, 1fr) 27rem;
        align-items: start;
      }
      .top {
        grid-column: 1 / -1;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.1rem;
      }
      h2 {
        margin: 0 0 0.4rem;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.65;
      }
      .hint {
        margin: 0;
        font-size: 0.82rem;
        line-height: 1.5;
        opacity: 0.75;
      }
      .viewer {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        background: #fff;
        overflow: hidden;
        min-height: 16rem;
      }
      #page {
        display: block;
        width: 100%;
        height: auto;
      }
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.9rem;
        color: #666;
        background: repeating-linear-gradient(45deg, #fafafa 0 10px, #f2f2f2 10px 20px);
      }
      #empty[hidden] {
        display: none;
      }
      .side {
        display: grid;
        gap: 0.7rem;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        padding: 0.7rem 0.8rem;
        background: var(--panel);
      }
      .card > summary {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.65;
        cursor: pointer;
      }
      #file {
        width: 100%;
        font-size: 0.82rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.55rem;
      }
      button {
        font: inherit;
        font-size: 0.82rem;
        padding: 0.4rem 0.75rem;
        border-radius: 0.3rem;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: inherit;
        border-color: var(--line);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .meta {
        margin: 0.5rem 0 0;
        font-size: 0.78rem;
        line-height: 1.5;
        opacity: 0.8;
        word-break: break-all;
      }
      .progress {
        height: 0.4rem;
        border-radius: 0.2rem;
        background: var(--line);
        overflow: hidden;
      }
      #bar {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.2s ease-out;
      }
      .toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-bottom: 0.55rem;
        font-size: 0.78rem;
      }
      .toggles label {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
      }
      .counts {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.15rem 0.7rem;
        margin: 0;
        font-size: 0.78rem;
      }
      .counts dt {
        opacity: 0.65;
      }
      .counts dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      pre {
        margin: 0;
        font-size: 0.74rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #musicxml {
        max-height: 22rem;
        overflow: auto;
        margin-top: 0.5rem;
      }
      #log {
        min-height: 8rem;
        max-height: 22rem;
        overflow: auto;
      }
      @media (max-width: 900px) {
        body {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <h1>HOMR 浏览器端乐谱识别（M4）</h1>
      <p class="hint">
        图片只在本机处理：Worker 内完成 BICUBIC 缩放 → 灰度 → CLAHE → SegNet 分割 → 谱表与音符几何
        → Transformer 解码 → MusicXML。不启动 Python 服务，也不上传图片。
      </p>
    </header>

    <main class="viewer">
      <canvas id="page" width="0" height="0"></canvas>
      <canvas id="overlay" width="0" height="0"></canvas>
      <div id="empty">选择一张乐谱图片开始</div>
    </main>

    <aside class="side">
      <section class="card">
        <input id="file" type="file" accept="image/jpeg,image/png" />
        <p id="file-info" class="meta">未选择图片</p>
        <div class="row">
          <button id="run" disabled>开始识别</button>
          <button id="sample" class="ghost">使用示例图片</button>
          <button id="replay" class="ghost">回放参考谱表</button>
        </div>
      </section>

      <section class="card">
        <div class="progress"><div id="bar"></div></div>
        <p id="status" class="meta">等待图片</p>
      </section>

      <section class="card">
        <h2>结果</h2>
        <div class="toggles">
          <label><input id="show-staffs" type="checkbox" checked />谱表</label>
          <label><input id="show-notes" type="checkbox" checked />音符头</label>
          <label><input id="show-symbols" type="checkbox" checked />识别符号</label>
          <label><input id="show-mask" type="checkbox" />分段掩码</label>
        </div>
        <dl id="counts" class="counts"></dl>
      </section>

      <section class="card">
        <h2>导出</h2>
        <div class="row">
          <button id="download-xml" disabled>MusicXML</button>
          <button id="download-json" disabled>定位 JSON</button>
          <button id="download-report" disabled>识别报告</button>
        </div>
      </section>

      <section class="card">
        <h2>运行环境</h2>
        <dl id="env" class="counts"></dl>
      </section>

      <details class="card">
        <summary>MusicXML</summary>
        <pre id="musicxml"></pre>
      </details>

      <section class="card">
        <h2>日志</h2>
        <pre id="log"></pre>
      </section>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
